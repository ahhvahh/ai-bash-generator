syntax = "proto3";

package ai_bash_gen.v1;

option go_package = "github.com/ahhvahh/ai-bash-generator/gen/ai_bash_gen/v1;ai_bash_gen_v1";

enum CapabilityType {
  CAPABILITY_TYPE_UNSPECIFIED = 0;
  CAPABILITY_TYPE_FUNCTION = 1;
  CAPABILITY_TYPE_SCRIPT = 2;
  CAPABILITY_TYPE_APPLICATION = 3;
  CAPABILITY_TYPE_SERVICE = 4;
}

enum NormalizationStatus {
  NORMALIZATION_STATUS_UNSPECIFIED = 0;
  NORMALIZATION_STATUS_READY = 1;
  NORMALIZATION_STATUS_MISSING_INFORMATION = 2;
  NORMALIZATION_STATUS_UNSUPPORTED = 3;
}

enum GenerationStatus {
  GENERATION_STATUS_UNSPECIFIED = 0;
  GENERATION_STATUS_READY = 1;
  GENERATION_STATUS_MISSING_INFORMATION = 2;
  GENERATION_STATUS_MISSING_CAPABILITY = 3;
  GENERATION_STATUS_UNSUPPORTED = 4;
}

enum DataKind {
  DATA_KIND_UNSPECIFIED = 0;
  DATA_KIND_TEXT = 1;
  DATA_KIND_INTEGER = 2;
  DATA_KIND_DECIMAL = 3;
  DATA_KIND_BOOLEAN = 4;
  DATA_KIND_PATH = 5;
  DATA_KIND_FILE = 6;
  DATA_KIND_LIST = 7;
  DATA_KIND_TABLE = 8;
  DATA_KIND_BINARY = 9;
}

enum StreamEncoding {
  STREAM_ENCODING_UNSPECIFIED = 0;
  STREAM_ENCODING_TEXT_UTF8 = 1;
  STREAM_ENCODING_JSON_LINES = 2;
  STREAM_ENCODING_TSV = 3;
  STREAM_ENCODING_NUL_DELIMITED = 4;
  STREAM_ENCODING_RAW_BINARY = 5;
}

message FieldSchema {
  string name = 1;
  DataKind kind = 2;
  bool required = 3;
}

message DataContract {
  DataKind kind = 1;

  // Used when kind == DATA_KIND_LIST.
  DataKind element_kind = 2;

  // Used when kind == DATA_KIND_TABLE.
  repeated FieldSchema fields = 3;

  // Encoding used on stdin/stdout when the value is streamed.
  StreamEncoding encoding = 4;

  bool nullable = 5;
}

message UserRequest {
  string text = 1;

  // request_id is generated internally by ai-bash-gen and is not client-controlled.
  reserved 2;
}

message MissingInput {
  string task_id = 1;
  string name = 2;
  string description = 3;
  DataContract contract = 4;
}

message TaskInput {
  string name = 1;
  DataContract contract = 2;

  oneof source {
    string literal = 3;
    string result_ref = 4;
  }
}

message TaskOutput {
  string name = 1;
  DataContract contract = 2;
}

message NormalizedTask {
  string id = 1;
  string instruction = 2;
  string input_description = 3;
  string output_description = 4;
  repeated TaskInput inputs = 5;
  TaskOutput output = 6;

  // Control dependency only. Data dependencies are derived from result_ref.
  repeated string depends_on = 7;
}

message NormalizedRequest {
  string intent = 1;
  string canonical_instruction = 2;
  string input_description = 3;
  string output_description = 4;
  repeated NormalizedTask tasks = 5;
  string final_output_ref = 6;
  NormalizationStatus status = 7;
  repeated MissingInput missing_inputs = 8;
}

message SearchBudget {
  uint32 composite_limit = 1;
  uint32 per_task_limit = 2;
  uint32 global_candidate_limit = 3;
  uint32 max_capability_details = 4;
}

message SearchCapabilitiesRequest {
  NormalizedRequest request = 1;
  SearchBudget budget = 2;
}

message ParameterContract {
  string name = 1;
  DataContract contract = 2;
  bool required = 3;
}

message CapabilityInterface {
  // Chained capability data is consumed through stdin.
  DataContract stdin_contract = 1;

  // Literal/scalar configuration is passed as explicit arguments.
  repeated ParameterContract arguments = 2;

  // Functional result is produced on stdout.
  DataContract stdout_contract = 3;
}

message CapabilityCandidate {
  string id = 1;
  CapabilityType type = 2;
  string description = 3;
  string match_instruction = 4;
  string input_description = 5;
  string output_description = 6;

  // Used by deterministic pruning. These fields may be omitted from the LLM view.
  CapabilityInterface interface = 7;
}

message TaskCandidates {
  string task_id = 1;
  repeated CapabilityCandidate candidates = 2;
}

message SearchCapabilitiesResponse {
  repeated CapabilityCandidate composite_candidates = 1;
  repeated TaskCandidates task_candidates = 2;
}

message CapabilityDetailRequest {
  string id = 1;

  // When omitted, the catalog returns the active version.
  optional uint32 version = 2;
}

message FunctionImplementation {
  string function_name = 1;
  string source = 2;
}

message ScriptImplementation {
  string path = 1;
  repeated string fixed_args = 2;
  string expected_sha256 = 3;
}

message ApplicationImplementation {
  string executable_path = 1;
  repeated string fixed_args = 2;
  string expected_sha256 = 3;
}

message ServiceImplementation {
  string unix_socket = 1;
  string operation = 2;
  uint32 timeout_ms = 3;

  // Controlled client responsible for speaking the service protocol.
  string client_executable = 4;
  repeated string fixed_args = 5;
  string client_expected_sha256 = 6;
}

message CapabilityImplementation {
  oneof implementation {
    FunctionImplementation function = 1;
    ScriptImplementation script = 2;
    ApplicationImplementation application = 3;
    ServiceImplementation service = 4;
  }
}

message CapabilityDefinition {
  string id = 1;
  uint64 capability_version_id = 2;
  uint32 version = 3;
  CapabilityType type = 4;
  string description = 5;
  string match_instruction = 6;
  string input_description = 7;
  string output_description = 8;
  CapabilityInterface interface = 9;
  CapabilityImplementation implementation = 10;
  repeated string dependencies = 11;
  uint32 risk_level = 12;
  string checksum = 13;
}

message ArgumentBinding {
  string name = 1;

  oneof source {
    string literal = 2;

    // Allowed only when the referenced output is scalar and the interface
    // explicitly accepts the value as an argument.
    string result_ref = 3;
  }
}

message CapabilityCall {
  string task_id = 1;
  string capability_id = 2;

  // Zero for a capability generated in the current request.
  uint64 capability_version_id = 3;

  repeated ArgumentBinding arguments = 4;

  // Primary stream composition path: producer stdout -> consumer stdin.
  string stdin_result_ref = 5;

  string output_ref = 6;
}

message GeneratedCapability {
  string id = 1;
  CapabilityType type = 2;
  string description = 3;
  string match_instruction = 4;
  string input_description = 5;
  string output_description = 6;
  CapabilityInterface interface = 7;
  CapabilityImplementation implementation = 8;
  repeated string dependencies = 9;
}

message GenerationPlan {
  GenerationStatus status = 1;
  repeated CapabilityCall calls = 2;
  repeated GeneratedCapability generated_capabilities = 3;
  string final_output_ref = 4;
  repeated string warnings = 5;
}

message ToolError {
  string code = 1;
  string message = 2;
}

message ToolPayload {
  // Fully-qualified protobuf message name for the MCP-specific payload.
  string schema = 1;

  // TextProto is used only at the LLM boundary.
  string textproto = 2;
}

message McpToolRequest {
  string server = 1;
  string tool = 2;
  ToolPayload arguments = 3;
}

message McpToolResult {
  string server = 1;
  string tool = 2;
  ToolPayload result = 3;
}

message GeneratorToolRequest {
  string call_id = 1;

  oneof request {
    CapabilityDetailRequest get_capability = 2;
    McpToolRequest generation_time_mcp = 3;
  }
}

message GeneratorToolRequests {
  repeated GeneratorToolRequest calls = 1;
}

message GeneratorToolResponse {
  string call_id = 1;

  oneof response {
    CapabilityDefinition capability = 2;
    ToolError error = 3;
    McpToolResult generation_time_mcp = 4;
  }
}

message GeneratorTurnRequest {
  string request_id = 1;
  uint32 turn_number = 2;
  NormalizedRequest request = 3;
  SearchCapabilitiesResponse candidates = 4;
  repeated GeneratorToolResponse tool_responses = 5;
}

message GeneratorTurnResult {
  oneof result {
    GeneratorToolRequests tool_requests = 1;
    GenerationPlan final_plan = 2;
  }
}

message ValidationRequest {
  GenerationPlan plan = 1;
  repeated CapabilityDefinition resolved_capabilities = 2;
}

message ValidationIssue {
  string code = 1;
  string message = 2;
}

message ValidationResult {
  bool valid = 1;
  GenerationPlan plan = 2;
  repeated CapabilityDefinition resolved_capabilities = 3;
  repeated ValidationIssue issues = 4;
}

message CapabilityPublishRequest {
  string request_id = 1;
  string idempotency_key = 2;
  GeneratedCapability capability = 3;
}

message CapabilityPublishResult {
  string capability_id = 1;
  uint64 capability_version_id = 2;
  uint32 version = 3;
  bool reused_existing = 4;
}

message BashOutputRequest {
  ValidationResult validation = 1;
  string requested_filename = 2;
}

message BashArtifact {
  string filename = 1;
  string content = 2;
  string sha256 = 3;
  string final_output_ref = 4;
}
