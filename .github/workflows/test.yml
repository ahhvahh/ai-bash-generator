name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install acceptance-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bash coreutils grep mawk passwd util-linux libc-bin systemd file binutils findutils postgresql-client
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Go tests
        working-directory: src/go
        run: go test ./...
      - name: Validate shell scripts
        run: bash -n build.sh install-binary.sh test-binary.sh test-installer.sh test-generation.sh
      - name: Installer regression tests
        run: AI_BASH_GEN_TEST_PRIVILEGED=1 bash test-installer.sh
      - name: Build and acceptance tests
        run: ./build.sh amd64
      - name: Verify dependency gate
        shell: bash
        run: |
          set -Eeuo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat >"$tmp/config.yaml" <<EOF
          llama:
            binary: "$tmp/missing-llama-server"
            model: "$tmp/missing-model.gguf"
          EOF

          set +e
          bin/amd64/ai-bash-gen --config "$tmp/config.yaml" --check-dependencies >"$tmp/check.out" 2>"$tmp/check.err"
          check_rc=$?
          AI_BASH_GEN_RUNTIME_DIR="$tmp/run" bin/amd64/ai-bash-gen --config "$tmp/config.yaml" >"$tmp/daemon.out" 2>"$tmp/daemon.err"
          daemon_rc=$?
          set -e

          cat "$tmp/check.out" "$tmp/check.err" "$tmp/daemon.out" "$tmp/daemon.err"
          test "$check_rc" -eq 1
          test "$daemon_rc" -eq 1
          test ! -S "$tmp/run/routes/generate.sock"
          grep -qi 'dependências\|llama-server\|modelo GGUF' "$tmp/check.err"
