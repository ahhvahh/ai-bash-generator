# Configuração de build e empacotamento Debian do ai-bash-generator.
# Consumidores esperados:
#   - build_master.sh      -> seção build
#   - package-debian.sh    -> package, publication, dependencies, accounts,
#                             permissions, services e lifecycle
#
# O arquivo fica em ./src/package.yaml.
schema: 2

project:
  name: "ai-bash-gen"
  root: ".."

  origin:
    repository: "https://github.com/ahhvahh/ai-bash-generator"
    homepage: "https://github.com/ahhvahh/ai-bash-generator"
    source_type: "git"

package:
  name: "ai-bash-gen"
  section: "utils"
  priority: "optional"
  maintainer: "A-Bioma Build System <noreply@localhost>"

  version:
    # Obtém a versão a partir das tags/commit do Git.
    strategy: "git"
    tag_prefix: "v"
    fallback: "0.0.0"

  description:
    short: "Gerador de scripts Bash do ecossistema A-Bioma"
    long: |
      Aplicação e serviço para geração local de scripts Bash utilizando
      agentes baseados em LLM, llama.cpp, Unix Domain Sockets e Protocol Buffers.

# ---------------------------------------------------------------------------
# BUILD / COMPILAÇÃO
# ---------------------------------------------------------------------------
# Esta seção descreve SOMENTE como transformar o código-fonte em artefatos
# prontos para empacotamento. Ela não define onde os arquivos serão instalados
# no servidor; os destinos finais pertencem à seção "publication".
#
# O build_master.sh deve:
#   1. ler esta seção;
#   2. posicionar-se em "working_directory";
#   3. receber/determinar a arquitetura que está sendo compilada;
#   4. substituir a variável ${architecture} pelo target selecionado;
#   5. executar os comandos na ordem cadastrada;
#   6. interromper imediatamente se qualquer comando retornar erro;
#   7. localizar o resultado usando "output.root" + "output.layout";
#   8. entregar essa pasta ao processo de empacotamento.
#
# IMPORTANTE SOBRE ARQUITETURA:
# Não cadastramos uma configuração completa para amd64, arm64 etc. quando
# todos utilizam exatamente a mesma sequência de compilação. Nesse cenário
# existe apenas "commands" e a variável ${architecture} é substituída em
# tempo de execução.
#
# "architecture_overrides" existe apenas para exceções. Use-o somente quando
# determinada arquitetura exigir comandos, variáveis de ambiente, toolchain
# ou preparação diferente das demais.
#
# Exemplo de execução para amd64:
#   architecture=amd64
#   working_directory=..
#   comando resultante: ./build.sh amd64
#   saída esperada: ../bin/amd64/
#
# Exemplo de execução para arm64:
#   architecture=arm64
#   comando resultante: ./build.sh arm64
#   saída esperada: ../bin/arm64/
build:
  # Diretório a partir do qual os comandos abaixo serão executados.
  # O caminho é relativo ao diretório onde está este package.yaml.
  # Como o YAML está em ./src/package.yaml, ".." representa a raiz do projeto.
  working_directory: ".."

  # Sequência padrão de compilação.
  # Os comandos são executados na ordem informada.
  # ${architecture} é uma variável resolvida pelo build_master.sh.
  # Exemplos de valores: amd64, arm64, arm, 386, riscv64.
  commands:
    - "./build.sh ${architecture}"

  # Sobrescritas específicas por arquitetura.
  # O objeto vazio significa que atualmente nenhuma arquitetura precisa de
  # tratamento diferente. Se uma entrada existir aqui, seus comandos substituem
  # a sequência padrão apenas para aquela arquitetura.
  architecture_overrides: {}
  #
  # Exemplo:
  # architecture_overrides:
  #   arm:
  #     commands:
  #       - "export GOARM=7"
  #       - "./build.sh arm"
  #
  # Outro exemplo para uma toolchain específica:
  #   riscv64:
  #     commands:
  #       - "export CC=riscv64-linux-gnu-gcc"
  #       - "./build.sh riscv64"

  output:
    # Pasta raiz onde o build deposita os resultados.
    # Este caminho também é relativo a "working_directory".
    root: "bin"

    # Subpasta que contém o resultado da arquitetura atual.
    # Para architecture=amd64, o caminho resolvido será bin/amd64.
    layout: "${architecture}"

    # Exige que exista exatamente uma saída de arquitetura não vazia para
    # o build processado. Isso ajuda a impedir que artefatos antigos de outra
    # compilação sejam empacotados por engano.
    selection: "exactly_one_nonempty"

# ---------------------------------------------------------------------------
# DEPENDÊNCIAS
# ---------------------------------------------------------------------------
# Dependências disponíveis em repositórios Debian devem ser declaradas aqui
# para que apt/dpkg resolvam a instalação antes da configuração do pacote.
dependencies:
  depends:
    - "bash"
    - "coreutils"
    - "grep"
    - "mawk"
    - "passwd"
    - "util-linux"
    - "libc-bin"
    - "systemd"
    - "file"
    - "binutils"
    - "findutils"
    - "ca-certificates"

  recommends:
    - "curl"

  suggests: []
  pre_depends: []

  # Etapas adicionais para dependências que não possam ser representadas
  # adequadamente apenas por Depends/Recommends.
  #
  # Estes comandos NÃO devem executar apt/apt-get. Pacotes Debian devem ser
  # declarados acima para evitar chamadas recursivas ao gerenciador de pacotes.
  setup:
    shell: "/bin/bash"
    stop_on_error: true
    commands:
      - name: "verificar-llama-server"
        when: "post_install"
        if: "test ! -x /usr/lib/ai-bash-gen/llama-server"
        run: |
          echo "[INFO] llama-server ainda não está instalado."
          echo "[INFO] O provisionamento do llama.cpp deve ser executado pelo instalador/provisionador configurado para o ambiente."

# ---------------------------------------------------------------------------
# PUBLICAÇÃO NO FILESYSTEM
# ---------------------------------------------------------------------------
# Destinos seguem o layout Debian/FHS.
# /run é temporário e deve ser criado em runtime (systemd), não incluído
# fisicamente no arquivo .deb.
publication:
  directories:
    - path: "/usr/bin"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

    - path: "/usr/lib/ai-bash-gen"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

    - path: "/etc/ai-bash-gen"
      owner: "root"
      group: "abioma"
      mode: "0750"
      managed_by: "package"

    - path: "/var/lib/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"
      managed_by: "package"

    - path: "/run/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"
      managed_by: "systemd"
      ephemeral: true

    - path: "/run/ai-bash-gen/routes"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"
      managed_by: "application"
      ephemeral: true

    - path: "/run/ai-bash-gen/internal"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0700"
      managed_by: "application"
      ephemeral: true

    - path: "/usr/lib/systemd/system"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

  files:
    - source: "ai-bash-gen"
      destination: "/usr/bin/ai-bash-gen"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "ai-bash-gen-generation-test"
      destination: "/usr/lib/ai-bash-gen/ai-bash-gen-generation-test"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-binary.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-binary.sh"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-generation.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-generation.sh"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-installer.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-installer.sh"
      owner: "root"
      group: "root"
      mode: "0755"

  conffiles:
    - "/etc/ai-bash-gen/config.yaml"

# ---------------------------------------------------------------------------
# CONTAS DE SISTEMA
# ---------------------------------------------------------------------------
# Convenção do ambiente A-Bioma:
#   - abioma-srv: usuário técnico usado para executar serviços/daemons;
#   - abioma:     grupo compartilhado usado para conceder acesso controlado;
#   - usr45:      usuário convidado/cliente autorizado a consumir o serviço.
#
# O usuário de serviço não deve possuir login interativo.
accounts:
  groups:
    - name: "abioma"
      system: true
      create_if_missing: true

  users:
    - name: "abioma-srv"
      system: true
      create_if_missing: true
      primary_group: "abioma"
      home: "/var/lib/ai-bash-gen"
      create_home: false
      shell: "/usr/sbin/nologin"

# ---------------------------------------------------------------------------
# AUTORIZAÇÃO / USUÁRIOS COM ACESSO
# ---------------------------------------------------------------------------
permissions:
  # Usuários locais autorizados a consumir a aplicação/serviço.
  # O empacotador/instalador deve validar que o usuário existe antes de
  # adicioná-lo ao grupo.
  # Usuários convidados/clientes que terão acesso às interfaces protegidas
  # pelo grupo definido em "access_group".
  # O usuário deve existir no servidor; o instalador não deve criá-lo
  # automaticamente como conta de login.
  allowed_users:
    - "usr45"

  # Grupo utilizado para liberar acesso à aplicação, diretórios e sockets.
  access_group: "abioma"

  # Cada usuário de "allowed_users" será incluído nos grupos abaixo.
  add_allowed_users_to_groups:
    - "abioma"

  filesystem:
    - path: "/etc/ai-bash-gen"
      owner: "root"
      group: "abioma"
      mode: "0750"

    - path: "/var/lib/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"

    - path: "/run/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"

    - path: "/run/ai-bash-gen/routes"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"

  runtime_objects:
    - path: "/run/ai-bash-gen/routes/*.sock"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0660"

# ---------------------------------------------------------------------------
# SERVIÇO
# ---------------------------------------------------------------------------
services:
  - name: "ai-bash-gen"
    manager: "systemd"
    unit_path: "/usr/lib/systemd/system/ai-bash-gen.service"
    enabled: true
    start_after_install: true

    # Serviços do ecossistema A-Bioma executam com esta identidade técnica.
    user: "abioma-srv"
    group: "abioma"

    description: "AI Bash Generator"
    exec_start: "/usr/bin/ai-bash-gen --config /etc/ai-bash-gen/config.yaml"

    environment:
      AI_BASH_GEN_RUNTIME_DIR: "/run/ai-bash-gen"
      AI_BASH_GEN_LOG_LEVEL: "debug"
      AI_BASH_GEN_LLAMA_LOG_VERBOSITY: "5"

    restart:
      policy: "on-failure"
      seconds: 2

    runtime:
      directory: "ai-bash-gen"
      mode: "0750"

    state:
      directory: "ai-bash-gen"
      mode: "0750"

    hardening:
      NoNewPrivileges: true
      PrivateTmp: true
      PrivateDevices: true
      ProtectSystem: "strict"
      ProtectHome: true
      ProtectKernelTunables: true
      ProtectKernelModules: true
      ProtectControlGroups: true
      RestrictAddressFamilies:
        - "AF_UNIX"
      LockPersonality: true
      MemoryDenyWriteExecute: false

# ---------------------------------------------------------------------------
# CICLO DE INSTALAÇÃO
# ---------------------------------------------------------------------------
# O package-debian.sh pode gerar os maintainer scripts a partir destas etapas.
lifecycle:
  pre_install: []

  post_install:
    - "create_system_accounts"
    - "apply_directory_permissions"
    - "authorize_allowed_users"
    - "run_dependency_setup"
    - "systemd_daemon_reload"
    - "enable_services"
    - "start_services"

  pre_remove:
    - "stop_services"

  post_remove:
    - "systemd_daemon_reload"

  purge:
    # Conta e dados persistentes não são apagados automaticamente.
    remove_system_users: false
    remove_system_groups: false
    remove_state: false
