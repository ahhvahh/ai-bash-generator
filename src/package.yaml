# Configuração de build e empacotamento Debian do ai-bash-generator.
# Contrato compatível com o A-Bioma Debian Package Builder:
# https://github.com/ahhvahh/a-bioma-pkg-debian
#
# Este arquivo fica em ./src/package.yaml e é a fonte de verdade para
# compilação, testes, publicação e montagem do pacote Debian.
schema: 1

project:
  name: "ai-bash-gen"

  origin:
    repository: "https://github.com/ahhvahh/ai-bash-generator"
    homepage: "https://github.com/ahhvahh/ai-bash-generator"
    source_type: "git"

package:
  name: "ai-bash-gen"
  section: "utils"
  priority: "optional"
  maintainer: "A-Bioma Build System <noreply@localhost>"

  version:
    strategy: "git"
    tag_prefix: "v"
    fallback: "0.0.0"

  description:
    short: "Gerador local de scripts Bash do ecossistema A-Bioma"
    long: |
      Aplicação e serviço para geração local de scripts Bash utilizando
      agentes baseados em LLM, llama.cpp, Unix Domain Sockets e Protocol Buffers.
      O pacote instala o daemon, ferramentas auxiliares e uma unit systemd.

# Dependências necessárias depois que o .deb estiver instalado.
# Ferramentas exclusivas da compilação (Go e Git) são verificadas pelos
# comandos de build e não são declaradas como dependências de runtime.
dependencies:
  depends:
    - "bash"
    - "coreutils"
    - "grep"
    - "mawk"
    - "passwd"
    - "util-linux"
    - "libc-bin"
    - "systemd"
    - "file"
    - "binutils"
    - "findutils"
    - "ca-certificates"

  recommends:
    - "curl"

  suggests: []
  pre_depends: []

  # O pacote não compila nem baixa llama.cpp durante o postinst.
  # O runtime externo deve ser provisionado antes da ativação do serviço.
  setup:
    shell: "/bin/bash"
    stop_on_error: true
    commands:
      - name: "verificar-llama-server"
        when: "post_install"
        if: "test ! -x /usr/local/lib/ai-bash-gen/llama-server"
        run: |
          echo "[AVISO] llama-server não está disponível em /usr/local/lib/ai-bash-gen/llama-server."
          echo "[AVISO] Provisione llama.cpp e um modelo GGUF antes de habilitar/iniciar ai-bash-gen."

# ---------------------------------------------------------------------------
# BUILD
# ---------------------------------------------------------------------------
# --src deve apontar para a raiz do repositório.
# Os comandos abaixo reproduzem diretamente o build.sh do projeto, sem chamar
# o script de build. O executor fornece PROJECT_ROOT, PACKAGE_YAML, BUILD_ARCH,
# DEBIAN_ARCH e, durante os testes, OUTPUT_ROOT.
build:
  working_directory: "."

  architectures:
    amd64:
      enabled: true
      debian_architecture: "amd64"
      description: "Linux x86-64; GOAMD64=v1 para compatibilidade ampla."
      commands:
        - 'command -v go >/dev/null 2>&1 || { echo "[ERRO] Go não encontrado no PATH." >&2; exit 1; }'
        - 'test -f "$PROJECT_ROOT/src/go/go.mod" || { echo "[ERRO] go.mod não encontrado." >&2; exit 1; }'
        - 'for f in install-binary.sh test-binary.sh test-installer.sh test-generation.sh; do test -f "$PROJECT_ROOT/$f" || { echo "[ERRO] arquivo obrigatório ausente: $f" >&2; exit 1; }; done'
        - 'rm -rf "$PROJECT_ROOT/bin" && mkdir -p "$PROJECT_ROOT/bin/amd64"'
        - 'COMMIT="$(git -C "$PROJECT_ROOT" rev-parse --short HEAD 2>/dev/null || printf unknown)"'
        - 'VERSION="$(git -C "$PROJECT_ROOT" describe --tags --always --dirty 2>/dev/null || printf dev)"'
        - 'LDFLAGS="-s -w -X github.com/ahhvahh/ai-bash-generator/internal/buildinfo.Version=$VERSION -X github.com/ahhvahh/ai-bash-generator/internal/buildinfo.Commit=$COMMIT"'
        - '(cd "$PROJECT_ROOT/src/go" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -trimpath -ldflags "$LDFLAGS" -o "$PROJECT_ROOT/bin/amd64/ai-bash-gen" ./cmd/ai-bash-gen)'
        - '(cd "$PROJECT_ROOT/src/go" && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1 go build -trimpath -o "$PROJECT_ROOT/bin/amd64/ai-bash-gen-generation-test" ./cmd/ai-bash-gen-generation-test)'
        - 'install -m 0755 "$PROJECT_ROOT/install-binary.sh" "$PROJECT_ROOT/bin/amd64/install-binary.sh"'
        - 'install -m 0755 "$PROJECT_ROOT/test-binary.sh" "$PROJECT_ROOT/bin/amd64/test-binary.sh"'
        - 'install -m 0755 "$PROJECT_ROOT/test-installer.sh" "$PROJECT_ROOT/bin/amd64/test-installer.sh"'
        - 'install -m 0755 "$PROJECT_ROOT/test-generation.sh" "$PROJECT_ROOT/bin/amd64/test-generation.sh"'
      output:
        root: "bin/amd64"
      tests:
        enabled: true
        commands:
          - 'bash -n "$PROJECT_ROOT/install-binary.sh" "$PROJECT_ROOT/test-binary.sh" "$PROJECT_ROOT/test-installer.sh" "$PROJECT_ROOT/test-generation.sh"'
          - '(cd "$PROJECT_ROOT/src/go" && go test ./...)'
          - 'bash "$PROJECT_ROOT/test-installer.sh"'
          - 'test -x "$OUTPUT_ROOT/ai-bash-gen"'
          - 'test -x "$OUTPUT_ROOT/ai-bash-gen-generation-test"'
          - '"$OUTPUT_ROOT/test-binary.sh" "$OUTPUT_ROOT/ai-bash-gen"'

