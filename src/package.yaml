# Exemplo real para o projeto ai-bash-generator.
# Sugestão de localização no repositório: ./src/package.yaml
schema: 1

project:
  # Resolvido relativamente à pasta onde este YAML estiver.
  # Se salvo em ./src/package.yaml, ".." aponta para a raiz do repositório.
  root: ".."

package:
  name: "ai-bash-gen"

  # Usa a mesma origem conceitual do build.sh: tags/commit Git.
  # Exemplos:
  #   v1.2.0           -> 1.2.0
  #   v1.2.0-3-gabc123 -> 1.2.0+3.gabc123
  #   abc123           -> 0.0.0+git.abc123
  version:
    strategy: "git"
    fallback: "0.0.0"

  section: "utils"
  priority: "optional"
  maintainer: "A-Bioma Build System <noreply@localhost>"
  homepage: "https://github.com/ahhvahh/ai-bash-generator"
  depends: []

  description:
    short: "Gerador de scripts Bash do ecossistema A-Bioma"
    long: |
      Distribuição compilada do ai-bash-gen.
      O pacote contém o binário e os arquivos auxiliares aprovados pelo build.

source:
  # O build.sh enviado limpa ./bin antes de cada compilação. Por isso o
  # empacotador exige exatamente UMA destas pastas existente e não vazia.
  selection: "exactly_one_nonempty"

  architectures:
    amd64:
      path: "bin/amd64"
      debian: "amd64"

    "386":
      path: "bin/386"
      debian: "i386"

    arm64:
      path: "bin/arm64"
      debian: "arm64"

    arm:
      path: "bin/arm"
      debian: "armhf"

    riscv64:
      path: "bin/riscv64"
      debian: "riscv64"

    ppc64:
      path: "bin/ppc64"
      debian: "ppc64"

    ppc64le:
      path: "bin/ppc64le"
      debian: "ppc64el"

    s390x:
      path: "bin/s390x"
      debian: "s390x"

    # O build.sh também oferece mips e mips64, mas não os mapeamos
    # automaticamente: GOARCH=mips/mips64 é big-endian, enquanto os nomes
    # Debian atuais mais comuns são mipsel/mips64el. O mapeamento deve ser
    # definido explicitamente quando o build usar a ABI/endian compatível.
    mips:
      enabled: false
      path: "bin/mips"
      debian: "mipsel"

    mips64:
      enabled: false
      path: "bin/mips64"
      debian: "mips64el"

install:
  # Preserva todo o conteúdo produzido pelo build.sh:
  #   ai-bash-gen
  #   install-binary.sh
  #   test-binary.sh
  #   test-installer.sh
  #   ai-bash-gen-generation-test
  #   test-generation.sh
  trees:
    - from: "."
      to: "/opt/ai-bash-gen"

  # Expõe o executável principal no PATH sem duplicar o binário.
  links:
    - path: "/usr/local/bin/ai-bash-gen"
      target: "/opt/ai-bash-gen/ai-bash-gen"

  files: []
  conffiles: []

# O empacotador aceita os quatro scripts nativos de manutenção do dpkg.
# Caminhos são relativos à raiz definida em project.root.
control_scripts:
  preinst: null
  postinst: null
  prerm: null
  postrm: null
