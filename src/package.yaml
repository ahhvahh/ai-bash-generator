# ---------------------------------------------------------------------------
# PUBLICAÇÃO
# ---------------------------------------------------------------------------
# source é relativo ao output.root da arquitetura selecionada.
publication:
  directories:
    - path: "/usr/bin"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

    - path: "/usr/lib/ai-bash-gen"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

    - path: "/usr/lib/ai-bash-gen/tools"
      owner: "root"
      group: "root"
      mode: "0755"
      managed_by: "package"

    - path: "/etc/ai-bash-gen"
      owner: "root"
      group: "abioma"
      mode: "0750"
      managed_by: "package"

    - path: "/var/lib/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"
      managed_by: "package"

    - path: "/run/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"
      managed_by: "systemd"
      ephemeral: true

  files:
    - source: "ai-bash-gen"
      destination: "/usr/bin/ai-bash-gen"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "ai-bash-gen-generation-test"
      destination: "/usr/lib/ai-bash-gen/ai-bash-gen-generation-test"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "install-binary.sh"
      destination: "/usr/lib/ai-bash-gen/tools/install-binary.sh"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-binary.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-binary.sh"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-installer.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-installer.sh"
      owner: "root"
      group: "root"
      mode: "0755"

    - source: "test-generation.sh"
      destination: "/usr/lib/ai-bash-gen/tools/test-generation.sh"
      owner: "root"
      group: "root"
      mode: "0755"

  terminal_links: []
  conffiles: []

# ---------------------------------------------------------------------------
# CONTAS E PERMISSÕES
# ---------------------------------------------------------------------------
accounts:
  groups:
    - name: "abioma"
      system: true
      create_if_missing: true

  users:
    - name: "abioma-srv"
      system: true
      create_if_missing: true
      primary_group: "abioma"
      home: "/var/lib/ai-bash-gen"
      create_home: false
      shell: "/usr/sbin/nologin"

permissions:
  # Conta humana já declarada na configuração anterior deste projeto.
  # O pacote somente adiciona a conta existente ao grupo; não cria login.
  allowed_users:
    - "usr45"

  access_group: "abioma"

  add_allowed_users_to_groups:
    - "abioma"

  filesystem:
    - path: "/etc/ai-bash-gen"
      owner: "root"
      group: "abioma"
      mode: "0750"

    - path: "/var/lib/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"

    - path: "/run/ai-bash-gen"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0750"

  runtime_objects:
    - path: "/run/ai-bash-gen/routes/*.sock"
      owner: "abioma-srv"
      group: "abioma"
      mode: "0660"

# ---------------------------------------------------------------------------
# SYSTEMD
# ---------------------------------------------------------------------------
services:
  - name: "ai-bash-gen"
    manager: "systemd"
    unit_path: "/usr/lib/systemd/system/ai-bash-gen.service"

    # O pacote não provisiona llama.cpp nem o modelo GGUF; por isso instala a
    # unit, mas não a habilita/inicia automaticamente.
    enabled: false
    start_after_install: false

    user: "abioma-srv"
    group: "abioma"
    working_directory: "/var/lib/ai-bash-gen"
    umask: "0007"
    supplementary_groups: []

    description: "AI Bash Generator"
    exec_start: "/usr/bin/ai-bash-gen --config /etc/ai-bash-gen/config.yaml"

    configuration:
      files:
        - path: "/etc/ai-bash-gen/config.yaml"
          conffile: true
          owner: "root"
          group: "abioma"
          mode: "0640"
          content: |
            # ai-bash-gen - configuração bootstrap
            llama:
              binary: /usr/local/lib/ai-bash-gen/llama-server
              model: /var/lib/ai-bash-gen/models/model.gguf
              context_size: 32768
              startup_timeout: 2m
              request_timeout: 10m
              max_tokens: 4096
              temperature: 0.2

    environment:
      AI_BASH_GEN_RUNTIME_DIR: "/run/ai-bash-gen"
      AI_BASH_GEN_LOG_LEVEL: "debug"
      AI_BASH_GEN_LLAMA_LOG_VERBOSITY: "5"

    restart:
      policy: "on-failure"
      seconds: 2

    runtime:
      directory: "ai-bash-gen"
      mode: "0750"

    state:
      directory: "ai-bash-gen"
      mode: "0750"

    hardening:
      NoNewPrivileges: true
      PrivateTmp: true
      PrivateDevices: true
      ProtectSystem: "strict"
      ProtectHome: true
      ProtectKernelTunables: true
      ProtectKernelModules: true
      ProtectControlGroups: true
      RestrictAddressFamilies:
        - "AF_UNIX"
      LockPersonality: true
      MemoryDenyWriteExecute: false

# ---------------------------------------------------------------------------
# TESTES PÓS-INSTALAÇÃO
# ---------------------------------------------------------------------------
post_install_checks:
  enabled: true
  script_path: "/usr/lib/ai-bash-gen/tools/post-install-checks.sh"
  failure_policy: "warn"

  retry:
    attempts: 5
    delay_seconds: 2

  check_started_services: true
  services: []

  commands:
    - 'test -x /usr/bin/ai-bash-gen'
    - 'test -r /etc/ai-bash-gen/config.yaml'
    - '/usr/bin/ai-bash-gen --show-paths | grep -Fxq "generate_socket=/run/ai-bash-gen/routes/generate.sock"'
    - '/usr/bin/ai-bash-gen --version >/dev/null'

# Ações declarativas reconhecidas pelo empacotador.
lifecycle:
  pre_install: []

  post_install:
    - "create_system_accounts"
    - "apply_directory_permissions"
    - "authorize_allowed_users"
    - "run_dependency_setup"
    - "systemd_daemon_reload"
    - "enable_services"
    - "start_services"
    - "run_post_install_checks"

  pre_remove:
    - "stop_services"

  post_remove:
    - "systemd_daemon_reload"

  purge:
    remove_system_users: false
    remove_system_groups: false
    remove_state: false
